name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install declared build backend
        run: python -m pip install "setuptools>=77"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        run: python scripts/build_release.py

      - name: Verify release inventory and isolated install
        run: python scripts/verify_release.py

      - name: Check patch whitespace
        run: git diff --check
