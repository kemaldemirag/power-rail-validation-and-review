[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-rail-validation"
version = "0.1.0"
description = "REP-02 power-rail validation data contracts"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"power_rail_validation.contracts" = ["contracts.csv", "field_dictionary.csv", "schemas/*.schema.json"]

[tool.unittest]
start-directory = "tests"

